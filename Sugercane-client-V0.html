<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <title>Suger Cane client</title>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; background:black; }
    #gameCanvas { display:block; margin:0; background:#000; }
    /* Small UI tweaks for clarity */
    #serverList { position: absolute; top: 8px; right: 8px; z-index: 999; color: #eee; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="serverList">
    <label for="server">Server:</label>
    <input id="server" type="text" value="wss://arch.mc" style="width:180px;" />
  </div>

  <script>
    // Rebranded name references
    var CLIENT_NAME = "Suger Cane client";
    document.title = CLIENT_NAME;

    // Canvas and WebGL context setup with performance-preferred attributes
    var canvas = document.getElementById('gameCanvas');

    function setupCanvas() {
      // allow lowering resolution for higher fps
      var dpr = window.devicePixelRatio || 1;
      // cap DPR to avoid huge resolutions on very high-DPI screens
      var capDPR = Math.min(dpr, 1.5);
      canvas.width = Math.floor(window.innerWidth * capDPR);
      canvas.height = Math.floor(window.innerHeight * capDPR);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    setupCanvas();
    window.addEventListener('resize', function() { setupCanvas(); });

    // Try WebGL2, fallback to WebGL
    var gl = null;
    try {
      gl = canvas.getContext('webgl2', { alpha: false, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
    } catch(e) { gl = null; }
    if(!gl) {
      try { gl = canvas.getContext('webgl', { alpha: false, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: false }); } catch(e) { gl = null; }
    }

    // Simple animation loop using requestAnimationFrame for better scheduling
    var lastTime = performance.now();
    var frameCount = 0;
    var fps = 0;

    function gameTick(now) {
      var dt = (now - lastTime) / 1000;
      lastTime = now;

      // Minimal rendering workload to keep canvas active; integrate with Eaglercraft rendering code
      if (gl) {
        // Clear only what's necessary
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      }

      frameCount++;
      if (now - (lastTime - dt*1000) >= 1000) {
        // compute fps roughly every second
        fps = frameCount;
        frameCount = 0;
      }

      // Schedule next frame
      requestAnimationFrame(gameTick);
    }

    // Start loop
    requestAnimationFrame(function(ts) { lastTime = ts; requestAnimationFrame(gameTick); });

    // Default server handling for any place that uses server list
    // If code elsewhere reads `document.getElementById('server')` this will provide default wss://arch.mc
    // For backward compatibility, expose a getter
    Object.defineProperty(window, 'DEFAULT_SERVER', { value: 'wss://arch.mc', writable: false });

    // Example: any init code can call getDefaultServer() to get this value
    function getDefaultServer() { return window.DEFAULT_SERVER; }

    // Console hint for rebranding
    console.log(CLIENT_NAME + ' initialized. Default server:', getDefaultServer());

    // Replace any remaining text nodes in the page that include old names (simple heuristic)
    function rebrandDocument(oldNames, newName) {
      var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
      var node;
      var count = 0;
      while (node = walker.nextNode()) {
        var text = node.nodeValue;
        oldNames.forEach(function(old) {
          if (text.indexOf(old) !== -1) {
            text = text.split(old).join(newName);
            count++;
          }
        });
        node.nodeValue = text;
      }
      return count;
    }

    // List of known previous names to replace
    var oldNames = ['Suger-Cane-client', 'Sugercane', 'Suger Cane', 'SugerCane', 'Sugar Cane client', 'SugarCane-client', 'Suger-Cane'];
    var replaced = rebrandDocument(oldNames, CLIENT_NAME);
    if (replaced > 0) console.log('Rebranded ' + replaced + ' text nodes to', CLIENT_NAME);

    // If you have Eaglercraft-specific boot code below, integrate the gl context and canvas size into it.

  </script>
</body>
</html>
